name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Lint and Format Check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check Prettier formatting
        run: npm run format:check

  # Test Backend Services
  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [calendar-service, objectives-service, tech-updates-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          npm ci
      
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          npm test
      
      - name: Run tests with coverage
        run: |
          cd services/${{ matrix.service }}
          npm run test:coverage

  # Test Frontend
  test-frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run tests
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadless
      
      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage

  # Build Services
  build-services:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Build Calendar Service
        run: |
          cd services/calendar-service
          npm ci
          npm run build
      
      - name: Build Objectives Service
        run: |
          cd services/objectives-service
          npm ci
          npm run build
      
      - name: Build Tech Updates Service
        run: |
          cd services/tech-updates-service
          npm ci
          npm run build
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build:prod

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: build-services
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Calendar Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/calendar-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/calendar-service:latest
            ${{ secrets.DOCKER_USERNAME }}/calendar-service:${{ github.sha }}
      
      - name: Build and push Objectives Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/objectives-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/objectives-service:latest
            ${{ secrets.DOCKER_USERNAME }}/objectives-service:${{ github.sha }}
      
      - name: Build and push Tech Updates Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/tech-updates-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tech-updates-service:latest
            ${{ secrets.DOCKER_USERNAME }}/tech-updates-service:${{ github.sha }}
      
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/domain-driven-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/domain-driven-frontend:${{ github.sha }}

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: build-services
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add deployment commands here
